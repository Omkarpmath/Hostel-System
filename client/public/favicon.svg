<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Inner Architectural Crest: Classical BMSET Gate & Pillars -->
  <!-- Roof / Pediment -->
  <path d="M14 26 L32 14 L50 26 Z" fill="url(#goldGrad)" />

  <!-- Classical Pillars -->
  <rect x="18" y="29" width="4.5" height="17" rx="1.5" fill="#ffffff" />
  <rect x="26.25" y="29" width="4.5" height="17" rx="1.5" fill="#ffffff" />
  <rect x="34.25" y="29" width="4.5" height="17" rx="1.5" fill="#ffffff" />
  <rect x="42.5" y="29" width="4.5" height="17" rx="1.5" fill="#ffffff" />

  <!-- Base Platform -->
  <rect x="14" y="47" width="36" height="4" rx="1.5" fill="url(#goldGrad)" />

  <!-- Core Embellishment -->
  <circle cx="32" cy="22" r="2.5" fill="#ffffff" />
</svg>